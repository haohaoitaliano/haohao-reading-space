name: Transcode comment audio

on:
  workflow_dispatch:
    inputs:
      comment_id:
        description: Submission comment UUID (blank runs recovery scan)
        required: false
        type: string
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"

permissions:
  contents: read

concurrency:
  group: comment-audio-transcode-${{ inputs.comment_id || 'recovery' }}
  cancel-in-progress: false

jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TRANSCODE_COMMENT_ID: ${{ inputs.comment_id || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Ensure FFmpeg is available
        run: ffmpeg -hide_banner -version
      - name: Generate iPhone-compatible playback
        run: pnpm comments:transcode -- --apply
